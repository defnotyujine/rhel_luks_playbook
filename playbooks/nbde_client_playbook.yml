---

- name: Enroll NBDE clients
  hosts: nbde_clients
  become: true

  pre_tasks:
    - name: Check ansible version is greater than 2.16.1
      ansible.builtin.fail:
        msg: >-
          Unsupported ansible-core version: {{ ansible_version.full }}.
          This playbook requires ansible-core 2.16.1 or higher.
      when: not (ansible_version.full is version('2.16.1', '>='))
      tags: always

    - name: Ensure the system is supported
      ansible.builtin.fail:
        msg: >-
          Unsupported OS: {{ ansible_distribution }}
          {{ ansible_distribution_major_version }}.
          This playbook supports RedHat family distributions only.
      when: ansible_os_family != "RedHat"
      tags: always

    - name: Ensure devices are defined for this host
      ansible.builtin.assert:
        that: nbde_client_bindings | default([]) | length > 0
        fail_msg: >-
          nbde_devices is not set for {{ inventory_hostname }}.
          Define it in host_vars, e.g., ['/dev/mapper/rhel-root'].
      tags: always

    - name: Confirm each device is a LUKS container
      ansible.builtin.command:
        cmd: cryptsetup isLuks {{ item }}
      loop: "{{ nbde_client_bindings | map(attribute='device') | list }}"
      changed_when: false

    - name: Confirm each Tang server is reachable from this node
      ansible.builtin.uri:
        url: "{{ item }}/adv"
      loop: "{{ tang_urls }}"
      changed_when: false

  tasks:
    - name: Bind devices via the NBDE Client system role
      ansible.builtin.include_role:
        name: fedora.linux_system_roles.nbde_client

    - name: Read back the Clevis bindings
      ansible.builtin.command:
        cmd: clevis luks list -d {{ item }}
      loop: "{{ nbde_client_bindings | map(attribute='device') | list }}"
      register: clevis_state
      changed_when: false

    - name: Report bindings
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.stdout_lines }}"
      loop: "{{ clevis_state.results }}"
      loop_control:
        label: "{{ item.item }}"

  post_tasks:
    - name: Reboot required required to verify unattended boot
      ansible.builtin.debug:
        msg: >-
          Keep console access available. If binding failed the host
          will prompt for a passphrase.
      tags: always

    - name: End of Ansible Deployment
      ansible.builtin.debug:
        msg: "Ansible Deployment Finished"
      tags: always
